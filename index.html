<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Echo of the Sunder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Echo">
    <meta name="theme-color" content="#1c0a28">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <style>html,body{background:#0b0806;margin:0;overflow:hidden;}
      /* iPhone: игра внутри безопасной зоны — полоса опыта не уходит под «полоску домой», HUD не под чёлкой */
      #unity-container.unity-mobile{top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);width:auto!important;height:auto!important;}
      /* v1.5: игра вертикальная — на широком экране (планшет, телефон боком) полоса 9:16 по центру, интерфейс не налезает */
      #unity-container.unity-mobile.hc-pillar{left:calc(50% - var(--hc-w) / 2)!important;right:auto!important;width:var(--hc-w)!important;}
      /* UI-2026 (стиль C): экран загрузки — ключевой арт, логотип, тлеющая полоса, проценты. Виден сразу, до загрузчика Unity */
      #unity-fullscreen-container #unity-loading-container{position:absolute;left:0;top:0;right:0;bottom:0;width:auto;height:auto;backdrop-filter:none;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
        background:#0b0806 url(TemplateData/hc_bg.webp) center 30%/cover no-repeat;overflow:hidden}
      #unity-loading-container::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,8,6,.55) 0%,rgba(11,8,6,0) 28%,rgba(11,8,6,0) 52%,rgba(11,8,6,.88) 82%,#0b0806 100%)}
      #hc-logo{position:relative;width:min(88%,640px);margin-top:max(7vh,calc(env(safe-area-inset-top) + 28px));filter:drop-shadow(0 6px 18px rgba(0,0,0,.65));animation:hcIn .9s cubic-bezier(.2,.8,.2,1) both}
      #unity-loading-bar{position:relative!important;left:auto!important;top:auto!important;transform:none!important;display:block!important;width:min(80%,520px);
        margin-bottom:max(9vh,calc(env(safe-area-inset-bottom) + 44px));animation:hcIn .9s .25s cubic-bezier(.2,.8,.2,1) both}
      #unity-logo{display:none!important}
      #unity-progress-bar-empty{width:100%!important;height:24px!important;margin:0!important;border-radius:12px;background:#1d130c!important;border:2px solid #9a6a36;
        box-shadow:inset 0 3px 7px rgba(0,0,0,.75),0 0 0 3px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.5);overflow:hidden;box-sizing:border-box}
      #unity-progress-bar-full{width:0;height:100%!important;margin:0!important;border-radius:10px;background:linear-gradient(180deg,#ffc070 0%,#ff8a24 50%,#c84a10 100%)!important;
        box-shadow:0 0 14px rgba(255,138,36,.75);transition:width .25s ease-out}
      #hc-status{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;color:#f3e9d8;letter-spacing:.03em;text-shadow:0 2px 4px #000;
        font:600 16px/1.2 "Fira Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,-apple-system,sans-serif}
      #hc-pct{color:#ffc65c;font-weight:700;font-size:18px}
      #hc-slogan{margin-top:10px;text-align:center;color:#cbb89a;font:500 14px/1.3 "Fira Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.06em;opacity:.9}
      @keyframes hcIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#hc-logo,#unity-loading-bar{animation:none}#unity-progress-bar-full{transition:none}}</style>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <img id="hc-logo" src="TemplateData/hc_logo.webp" alt="Echo of the Sunder">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
            <div id="hc-status"><span id="hc-text">Loading the Wastes…</span><span id="hc-pct">0%</span></div>
            <div id="hc-slogan">One survivor. One road home.</div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer" style="display:none">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Horde Capital</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVer = "20261109183727";   // подставляет deploy_pages.sh: новая версия → браузер не берёт старую сборку из кэша
      var loaderUrl = buildUrl + "/WebGL.loader.js?v=" + buildVer;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb?v=" + buildVer,
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb?v=" + buildVer,
        codeUrl: buildUrl + "/WebGL.wasm.unityweb?v=" + buildVer,
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "Damir",
        productName: "Horde Capital",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))) {   // iPadOS Safari называет себя Mac
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';   // safe-area: см. стиль #unity-container
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        // v1.5: широкий экран (планшет, телефон боком) — вертикальная полоса 9:16 по центру; интерфейс игры рассчитан на портрет
        var hcFit = function () {
          var c = document.querySelector("#unity-container"), w = window.innerWidth, h = window.innerHeight;
          if (w / h > 0.62) { c.classList.add("hc-pillar"); c.style.setProperty("--hc-w", Math.round(h * 0.5625) + "px"); }
          else c.classList.remove("hc-pillar");
        };
        hcFit(); window.addEventListener("resize", hcFit); window.addEventListener("orientationchange", function () { setTimeout(hcFit, 250); });

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 3);   // интерфейс в полном разрешении экрана; 3D ограничивает HC_Quality (потолок пикселей по длинной стороне)   // на телефоне 1.5x: меньше пикселей — меньше нагрев   // iPhone рендерит в 3x — ограничиваем 2x, чтобы не грелся


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "450px";
        fullscreenContainer.style.height = "975px";   // игра вертикальная
      }


      // v1.4: GitHub не принимает файлы больше 100 МиБ, поэтому deploy_pages.sh режет WebGL.data.unityweb на части (.part0, .part1…)
      // без потерь. Здесь части качаются, склеиваются в один Blob и кладутся в IndexedDB по версии сборки: повторный вход
      // не качает заново (как кэш Unity). Unity получает обычный blob:-адрес; свой кэш для него Unity не ведёт (no-store).
      // v2.0 (СТАБИЛЬНОСТЬ): запись запуска localStorage "hc_run2" вместо флага hc_running (v1.5b). Флаг считал «вылетом» и выгрузку
      // фоновой вкладки (iOS делает это при переключении приложений) — качество навсегда сползало до «Низкого».
      // Прошлая запись → window.hcPrevRun (игра сама решит, был ли настоящий вылет: HC_PerfDiag.cs + HC_PerfDiag.jslib), новая — сразу
      // «load» ДО скачивания данных: вылет во время скачивания/распаковки тоже виден. После старта игры запись ведёт HC_PerfDiag.jslib.
      try { window.hcPrevRun = JSON.parse(localStorage.getItem("hc_run2") || "null"); } catch (e) { window.hcPrevRun = null; }
      window.hcRun = { v: "", t0: Date.now(), beat: Date.now(), st: document.hidden ? "bg" : "load", bg: 0 };
      var hcRunSave = function () { try { localStorage.setItem("hc_run2", JSON.stringify(window.hcRun)); } catch (e) {} };
      hcRunSave();
      try { localStorage.removeItem("hc_running"); } catch (e) {}
      var hcLoading = function () { return !window.hcDiagHooked && window.hcRun.st !== "end"; };   // пока игра не взяла запись себе
      var hcLoadBeat = setInterval(function () { if (!hcLoading()) { clearInterval(hcLoadBeat); return; } window.hcRun.beat = Date.now(); hcRunSave(); }, 5000);
      document.addEventListener("visibilitychange", function () {
        if (!hcLoading()) return;
        var r = window.hcRun; if (document.hidden) { r.st = "bg"; r.bg++; } else r.st = "load"; r.beat = Date.now(); hcRunSave();
      });
      window.addEventListener("pagehide", function () { if (!hcLoading()) return; window.hcRun.st = "end"; window.hcRun.beat = Date.now(); hcRunSave(); });
      var dataParts = 3;   // подставляет deploy_pages.sh
      function hcIdb(fn) {
        return new Promise(function (ok) {
          try {
            var rq = indexedDB.open("hc_data", 1);
            rq.onupgradeneeded = function () { rq.result.createObjectStore("d"); };
            rq.onsuccess = function () { try { fn(rq.result, ok); } catch (e) { ok(null); } };
            rq.onerror = function () { ok(null); };
          } catch (e) { ok(null); }
        });
      }
      function hcData(onProgress) {
        if (dataParts <= 1) return Promise.resolve(config.dataUrl);
        var key = "data_" + buildVer;
        return hcIdb(function (db, ok) {
          var g = db.transaction("d").objectStore("d").get(key);
          g.onsuccess = function () { ok(g.result || null); }; g.onerror = function () { ok(null); };
        }).then(function (cached) {
          if (cached && cached.size > 0) { onProgress(1); return cached; }
          var got = [], size = [];
          for (var i = 0; i < dataParts; i++) { got.push(0); size.push(0); }
          function report() { var a = 0, b = 0; for (var i = 0; i < dataParts; i++) { a += got[i]; b += size[i] || 45e6; } onProgress(Math.min(1, a / b)); }
          function part(i) {
            return fetch(buildUrl + "/WebGL.data.unityweb.part" + i + "?v=" + buildVer).then(function (r) {
              if (!r.ok) throw new Error("data part " + i + ": HTTP " + r.status);
              size[i] = +r.headers.get("Content-Length") || 0;
              if (!r.body || !r.body.getReader) return r.blob();
              var rd = r.body.getReader(), chunks = [];
              function pump() { return rd.read().then(function (s) { if (s.done) return new Blob(chunks); chunks.push(s.value); got[i] += s.value.length; report(); return pump(); }); }
              return pump();
            });
          }
          var jobs = []; for (var i = 0; i < dataParts; i++) jobs.push(part(i));
          return Promise.all(jobs).then(function (blobs) {
            var blob = new Blob(blobs, { type: "application/octet-stream" });
            hcIdb(function (db, ok) {   // старые версии — вон, новая — в базу (ошибка квоты не мешает игре)
              var tx = db.transaction("d", "readwrite"), st = tx.objectStore("d");
              st.clear(); st.put(blob, key); tx.oncomplete = function () { ok(true); }; tx.onerror = function () { ok(false); };
            });
            return blob;
          });
        }).then(function (b) { return typeof b === "string" ? b : URL.createObjectURL(b); });
      }
      config.cacheControl = function (url) { return url.indexOf("blob:") === 0 ? "no-store" : "must-revalidate"; };

      // UI-2026: полоса + проценты + что сейчас идёт (скачивание данных → запуск)
      var hcBar = document.querySelector("#unity-progress-bar-full"), hcPct = document.querySelector("#hc-pct"), hcTxt = document.querySelector("#hc-text");
      function hcProgress(p, phase) {
        p = Math.max(0, Math.min(1, p)); hcBar.style.width = (100 * p).toFixed(1) + "%"; hcPct.textContent = Math.floor(100 * p) + "%";
        hcTxt.textContent = phase || (p < 0.9 ? "Loading the Wastes…" : "Lighting the braziers…");
      }
      if (/[?&]demo(&|=|$)/.test(location.search)) {   // просмотр экрана загрузки без сборки: index.html?demo
        var dp = 0; setInterval(function () { dp = Math.min(0.62, dp + 0.02); hcProgress(dp); }, 60);
      } else {
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const share = dataParts > 1 ? 0.9 : 0;   // доля полосы на скачивание частей данных
        loadingContainer.style.display = "flex";

        hcData(function (p) { hcProgress(share * p, "Loading the Wastes…"); }).then(function (dataUrl) {
          config.dataUrl = dataUrl;
          return createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "flex";
            hcProgress(share + (1 - share) * progress, share + (1 - share) * progress < 0.9 ? null : "Lighting the braziers…");
          } else {
            loadingContainer.style.display = "none";
          }
        });
        }).then((unityInstance) => {
                if (config.dataUrl.indexOf("blob:") === 0) URL.revokeObjectURL(config.dataUrl);   // данные уже в памяти Unity
                window.unityInstance = unityInstance;   // сохранение прогресса при сворачивании вкладки Safari (HC_Save)
                document.addEventListener('visibilitychange', function () { if (document.hidden && window.unityInstance) window.unityInstance.SendMessage('HC_SAVE', 'OnVisibility', 'hidden'); });
                window.addEventListener('pagehide', function () { if (window.unityInstance) window.unityInstance.SendMessage('HC_SAVE', 'OnVisibility', 'hidden'); });
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
      }

    </script>
  </body>
</html>
